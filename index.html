<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teaching Animations 导航</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-a: #fff9e7;
      --bg-b: #ffe9d4;
      --bg-c: #ddf5ff;
      --ink: #2e2945;
      --ink-soft: #645e79;
      --card: rgba(255, 255, 255, 0.9);
      --line: rgba(92, 76, 140, 0.2);
      --cta-bg: #ffe6a7;
      --cta-ink: #7f5b1f;
      --pill-bg: #f3efff;
      --pill-ink: #5a4c88;
      --accent: #ff9b6d;
      --accent-2: #76ceb9;
      --shadow: 0 14px 34px rgba(62, 48, 95, 0.15);
      --card-shadow: 0 10px 24px rgba(62, 48, 95, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Nunito", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 8% 14%, rgba(255, 199, 230, 0.9), transparent 27%),
        radial-gradient(circle at 90% 12%, rgba(178, 242, 255, 0.95), transparent 25%),
        radial-gradient(circle at 18% 86%, rgba(193, 236, 188, 0.9), transparent 24%),
        linear-gradient(140deg, var(--bg-a), var(--bg-b) 44%, var(--bg-c));
      background-attachment: fixed;
    }

    .page {
      width: min(1100px, 92vw);
      margin: 40px auto 56px;
    }

    .hero {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 28px 26px;
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
      filter: blur(2px);
      opacity: 0.75;
    }

    .hero::before {
      width: 150px;
      height: 150px;
      top: -70px;
      right: -35px;
      background: linear-gradient(135deg, #ffd3db, #ffc7a1);
    }

    .hero::after {
      width: 120px;
      height: 120px;
      bottom: -54px;
      left: -38px;
      background: linear-gradient(135deg, #cbf4ef, #cde6ff);
    }

    h1 {
      margin: 0;
      font-family: "Baloo 2", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: clamp(30px, 5.2vw, 46px);
      line-height: 1.05;
      letter-spacing: 0.3px;
    }

    .subtext {
      margin: 10px 0 0;
      color: var(--ink-soft);
      font-size: clamp(15px, 2.6vw, 18px);
    }

    .search-wrap {
      margin-top: 20px;
      display: grid;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    #searchInput {
      width: 100%;
      border-radius: 16px;
      border: 2px solid rgba(121, 101, 166, 0.2);
      background: #fff;
      padding: 13px 14px;
      font-size: 16px;
      outline: none;
      color: var(--ink);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #searchInput:focus {
      border-color: rgba(255, 126, 147, 0.66);
      box-shadow: 0 0 0 4px rgba(255, 126, 147, 0.17);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--ink-soft);
      font-size: 14px;
    }

    .card-grid {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }

    .card {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 16px 16px 14px;
      background: var(--card);
      box-shadow: var(--card-shadow);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform: translateY(0);
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      overflow: hidden;
      isolation: isolate;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), #ffce7a, var(--accent-2));
      opacity: 0.9;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 155, 109, 0.62);
      box-shadow: 0 16px 28px rgba(62, 48, 95, 0.18);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .card-title {
      margin: 0;
      font-size: 31px;
      line-height: 1.24;
      font-weight: 700;
      letter-spacing: 0.1px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-id {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 700;
      color: var(--pill-ink);
      background: var(--pill-bg);
      border: 1px solid rgba(90, 76, 136, 0.2);
      max-width: 112px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-cta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .chip {
      align-self: flex-start;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2px;
      background: var(--cta-bg);
      color: var(--cta-ink);
      border: 1px solid rgba(127, 91, 31, 0.15);
      box-shadow: 0 2px 0 rgba(127, 91, 31, 0.16);
    }

    .card-arrow {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(160deg, var(--accent), var(--accent-2));
      transform: translateX(0);
      transition: transform 0.18s ease;
      box-shadow: 0 6px 12px rgba(77, 66, 120, 0.25);
    }

    .card:hover .card-arrow {
      transform: translateX(2px);
    }

    .path-wrap {
      border-radius: 12px;
      background: rgba(243, 239, 255, 0.72);
      border: 1px dashed rgba(92, 76, 140, 0.3);
      padding: 7px 9px;
    }

    .path {
      font-size: 12px;
      color: var(--ink-soft);
      word-break: break-all;
      opacity: 0.95;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      line-height: 1.4;
    }

    .empty {
      margin-top: 18px;
      border: 1px dashed rgba(101, 95, 121, 0.45);
      border-radius: 16px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.65);
      color: var(--ink-soft);
      text-align: center;
      display: none;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 99px;
      margin-right: 6px;
      vertical-align: -1px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
    }

    @media (max-width: 640px) {
      .page {
        width: min(1100px, 95vw);
        margin-top: 22px;
      }

      .hero {
        border-radius: 22px;
        padding: 20px 16px;
      }

      .card-grid {
        gap: 12px;
        grid-template-columns: 1fr;
      }

      .card {
        border-radius: 18px;
        padding: 14px 13px;
      }

      .card-title {
        font-size: 21px;
      }

      .card-id {
        max-width: 96px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>Teaching Animations</h1>
      <p class="subtext">一个可爱的多学科静态导航页，直接跳转到每个演示页面。</p>
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="搜索页面名称，例如：电场 / 几何 / 微元" aria-label="搜索演示页面">
        <div class="meta">
          <span><span class="dot"></span>实时过滤</span>
          <span id="countText"></span>
        </div>
      </div>
    </section>

    <section id="cardGrid" class="card-grid" aria-live="polite"></section>
    <div id="emptyState" class="empty">没有找到匹配页面，换个关键词试试。</div>
  </main>

  <script src="/scene-fallback.js"></script>
  <script type="module">
    import { toNavFileName } from "/src/app/navigation-display.ts";

    const fallbackPages = Array.isArray(window.__SCENE_FALLBACK__) ? window.__SCENE_FALLBACK__ : [];

    let pages = [...fallbackPages];
    let usingFallback = false;

    const searchInput = document.getElementById("searchInput");
    const cardGrid = document.getElementById("cardGrid");
    const emptyState = document.getElementById("emptyState");
    const countText = document.getElementById("countText");

    function setCountText(filteredCount, totalCount) {
      const suffix = usingFallback ? "（使用内置列表）" : "";
      countText.textContent = `显示 ${filteredCount} / ${totalCount}${suffix}`;
    }

    function sortPages(items) {
      return [...items].sort((a, b) => a.title.localeCompare(b.title, "zh-Hans-CN", { numeric: true, sensitivity: "base" }));
    }

    function normalizePages(input) {
      if (!Array.isArray(input)) return [];
      return input
        .filter((item) => item && typeof item.title === "string" && typeof item.path === "string")
        .map((item, index) => ({
          id: typeof item.id === "string" ? item.id : `scene-${index}`,
          title: item.title.trim(),
          path: item.path.trim()
        }))
        .filter((item) => item.title.length > 0 && item.path.length > 0);
    }

    function renderCards(keyword) {
      const query = keyword.trim().toLowerCase();
      const filtered = pages.filter((item) => {
        return item.title.toLowerCase().includes(query) || item.path.toLowerCase().includes(query);
      });

      cardGrid.innerHTML = "";
      for (const item of filtered) {
        const card = document.createElement("a");
        card.className = "card";
        card.href = encodeURI(item.path);
        card.setAttribute("aria-label", `打开页面：${item.title}`);

        const top = document.createElement("div");
        top.className = "card-top";

        const title = document.createElement("h2");
        title.className = "card-title";
        title.textContent = item.title;

        const sceneId = document.createElement("span");
        sceneId.className = "card-id";
        sceneId.textContent = item.id;

        top.appendChild(title);
        top.appendChild(sceneId);

        const ctaRow = document.createElement("div");
        ctaRow.className = "card-cta";

        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = "打开页面";

        const arrow = document.createElement("span");
        arrow.className = "card-arrow";
        arrow.setAttribute("aria-hidden", "true");
        arrow.textContent = "↗";

        ctaRow.appendChild(chip);
        ctaRow.appendChild(arrow);

        const pathWrap = document.createElement("div");
        pathWrap.className = "path-wrap";
        const path = document.createElement("div");
        path.className = "path";
        path.textContent = toNavFileName(item.path);
        pathWrap.appendChild(path);

        card.appendChild(top);
        card.appendChild(ctaRow);
        card.appendChild(pathWrap);
        cardGrid.appendChild(card);
      }

      setCountText(filtered.length, pages.length);
      emptyState.style.display = filtered.length === 0 ? "block" : "none";
    }

    async function loadPagesFromIndex() {
      const response = await fetch("scene-index.json", { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Failed to load scene-index.json: ${response.status}`);
      }
      const data = await response.json();
      return normalizePages(data);
    }

    async function initPageList() {
      countText.textContent = "正在加载索引...";
      try {
        const loaded = await loadPagesFromIndex();
        if (loaded.length > 0) {
          pages = sortPages(loaded);
          usingFallback = false;
        } else {
          pages = sortPages(fallbackPages);
          usingFallback = true;
        }
      } catch (error) {
        pages = sortPages(fallbackPages);
        usingFallback = true;
        console.warn("加载 scene-index.json 失败，已使用内置列表:", error);
      }

      renderCards(searchInput.value);
    }

    searchInput.addEventListener("input", (event) => renderCards(event.target.value));
    initPageList();
  </script>
</body>
</html>
