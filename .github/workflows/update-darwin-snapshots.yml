name: Update darwin visual baselines

# darwin 视觉基线必须在 macOS 渲染栈上生成（字体光栅化与 Linux 不可互替）。
# 本工作流在 macos-latest runner 上重生成基线并上传 artifact，
# 等效于在 Mac 本地执行 `pnpm test:visual:update`（见 AGENTS.md 基线规则）。
on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Playwright --grep 过滤串（如 'desktop foo|mobile foo'）；留空 = 全量（慎用：会重写全部既有基线）"
        required: false
        default: ''

# 最小权限：只需读取仓库；artifact 上传不依赖 GITHUB_TOKEN 写权限。
permissions:
  contents: read

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # 版本取自 package.json 的 packageManager（与本地 corepack 一致）
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      # macOS 无 Noto Sans CJK SC，字体栈回退 PingFang SC（design-tokens.css），
      # 与 Mac 本地开发机渲染一致，无需额外装字体。
      - name: Build
        run: pnpm build

      - name: Regenerate darwin visual baselines
        run: |
          if [ -n "${{ inputs.grep }}" ]; then
            PLAYWRIGHT_SKIP_BUILD=1 pnpm exec playwright test tests/visual/visual-regression.spec.ts --update-snapshots --grep "${{ inputs.grep }}"
          else
            PLAYWRIGHT_SKIP_BUILD=1 pnpm exec playwright test tests/visual/visual-regression.spec.ts --update-snapshots
          fi

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-darwin
          path: tests/visual/visual-regression.spec.ts-snapshots/*-darwin.png
