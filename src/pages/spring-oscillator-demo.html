<!DOCTYPE html>

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    * {
      margin: 0;

      --bg-secondary: rgba(241, 245, 249, 0.8);

      --text-secondary: #64748b;
