<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 阻止 theme flash：在 JS 运行前从统一主题存储或系统偏好恢复主题
      (function () {
        function parseTheme(raw) {
          if (!raw) return null;
          if (raw === 'light' || raw === 'dark' || raw === 'system') return raw;
          try {
            var parsed = JSON.parse(raw);
            if (
              parsed &&
              parsed.v === 1 &&
              (parsed.theme === 'light' ||
                parsed.theme === 'dark' ||
                parsed.theme === 'system')
            ) {
              return parsed.theme;
            }
          } catch (e) {}
          return null;
        }
        try {
          var theme = parseTheme(localStorage.getItem('physics-lab-theme'));
          // 兼容旧版容器状态中的 theme 字段
          if (!theme) {
            theme = parseTheme(
              localStorage.getItem('physics-demos-container-state')
            );
          }
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          if (theme) {
            document.documentElement.setAttribute('data-theme', theme);
            return;
          }
        } catch (e) {}
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <title>弹簧振子 - 物理演示</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family:
          'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }

      #app {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="../scenes/spring-oscillator/page.ts"></script>
  </body>
</html>
