<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电路水流类比模型</title>
    
    <!-- 1. 引入 Tailwind CSS (样式库) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- 3. 引入 Babel (让浏览器能看懂 JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; font-family: sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>

    <!-- React 挂载点 -->
    <div id="root"></div>

    <!-- React 代码区域 -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const searchParams = new URLSearchParams(window.location.search);
        const isEmbedMode = searchParams.get('embed') === '1';

        function clamp01(value) {
            return Math.min(1, Math.max(0, value));
        }

        function postToHost(payload) {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(payload, '*');
            }
        }

        function emitStatus(text) {
            postToHost({ type: 'legacy:status', text });
        }

        const IconZap = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        );
        const IconActivity = ({ className, size }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        );
        const IconPointer = ({ size, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/></svg>
        );
        const IconInfo = ({ size, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        );

        const WaterPumpBattery = () => {
            const canvasRef = useRef(null);
            const particlesRef = useRef([]);
            const animationFrameRef = useRef(null);
            const impellerAngleRef = useRef(0);
            const lastReadoutAtRef = useRef(0);

            const EMF = 1.5;
            const INTERNAL_R_FACTOR = 0.5;

            const [isSystemOn, setIsSystemOn] = useState(false);
            const [tapOpening, setTapOpening] = useState(0.5);
            const [isPresentationMode, setIsPresentationMode] = useState(false);

            const [currentI, setCurrentI] = useState(0);
            const [internalDrop, setInternalDrop] = useState(0);
            const [terminalVoltage, setTerminalVoltage] = useState(1.5);

            function resetScene(toNormalMode = false) {
                setIsSystemOn(false);
                setTapOpening(0.5);
                if (toNormalMode) {
                    setIsPresentationMode(false);
                }
            }

            function emitReadout(force = false) {
                const now = performance.now();
                if (!force && now - lastReadoutAtRef.current < 120) {
                    return;
                }
                lastReadoutAtRef.current = now;
                postToHost({
                    type: 'legacy:readout',
                    items: [
                        { label: '显示模式', value: isPresentationMode ? '演示模式' : '标准模式' },
                        { label: '系统状态', value: isSystemOn ? '通路' : '断路' },
                        { label: '开度', value: `${Math.round(tapOpening * 100)}%` },
                        { label: '电流 I', value: `${currentI.toFixed(2)} A` },
                        { label: '内阻压降 Ir', value: `${internalDrop.toFixed(2)} V` },
                        { label: '路端电压 U', value: `${terminalVoltage.toFixed(2)} V` }
                    ]
                });
            }

            useEffect(() => {
                const particles = [];
                const particleCount = 160;
                for (let i = 0; i < particleCount; i++) {
                    particles.push({
                        x: Math.random() * 1400,
                        y: (Math.random() - 0.5) * 26,
                        speedOffset: 0.8 + Math.random() * 0.4,
                        size: 2 + Math.random() * 2
                    });
                }
                particlesRef.current = particles;
            }, []);

            useEffect(() => {
                let I = 0;
                let Ir = 0;
                let U = EMF;

                if (isSystemOn) {
                    const maxPossibleCurrent = 0.6;
                    I = tapOpening * maxPossibleCurrent;
                    Ir = I * INTERNAL_R_FACTOR;
                    U = EMF - Ir;
                }

                setCurrentI(I);
                setInternalDrop(Ir);
                setTerminalVoltage(U);
            }, [isSystemOn, tapOpening]);

            useEffect(() => {
                emitReadout(true);
            }, [isSystemOn, tapOpening, currentI, internalDrop, terminalVoltage, isPresentationMode]);

            useEffect(() => {
                emitStatus(isEmbedMode ? '2D 动画嵌入模式已就绪' : '场景已就绪');
                emitReadout(true);
            }, []);

            useEffect(() => {
                const onMessage = (event) => {
                    if (event.origin !== window.location.origin) {
                        return;
                    }
                    const data = event.data;
                    if (!data || typeof data !== 'object') {
                        return;
                    }

                    if (data.type === 'legacy:control') {
                        if (data.action === 'play') {
                            setIsSystemOn(true);
                            emitStatus('已打开通路');
                            return;
                        }
                        if (data.action === 'pause') {
                            setIsSystemOn(false);
                            emitStatus('已关闭通路');
                            return;
                        }
                        if (data.action === 'reset') {
                            resetScene(true);
                            emitStatus('已重置场景');
                            return;
                        }
                        if (data.action === 'step') {
                            setTapOpening((prev) => clamp01(prev + 0.05));
                            setIsSystemOn(true);
                            emitStatus('已单步提升开度');
                            return;
                        }
                    }

                    if (data.type === 'legacy:control-ext' && typeof data.command === 'string') {
                        if (data.command === 'set-system-on') {
                            const on = !!(data.payload && data.payload.on === true);
                            setIsSystemOn(on);
                            emitStatus(on ? '已打开通路' : '已关闭通路');
                            return;
                        }
                        if (data.command === 'set-tap-opening') {
                            const opening =
                                data.payload && typeof data.payload.opening === 'number'
                                    ? clamp01(data.payload.opening)
                                    : tapOpening;
                            setTapOpening(opening);
                            if (opening > 0 && !isSystemOn) {
                                setIsSystemOn(true);
                            }
                            return;
                        }
                        if (data.command === 'set-presentation') {
                            const presentation = !!(data.payload && data.payload.presentation === true);
                            setIsPresentationMode(presentation);
                            emitStatus(presentation ? '演示模式已应用到动画' : '标准模式已应用到动画');
                            return;
                        }
                        if (data.command === 'reset') {
                            resetScene(true);
                            emitStatus('已重置场景');
                        }
                    }
                };

                window.addEventListener('message', onMessage);
                return () => window.removeEventListener('message', onMessage);
            }, [isSystemOn, tapOpening]);

            const draw = (ctx, width, height) => {
                ctx.clearRect(0, 0, width, height);

                const visualScale = isPresentationMode ? 1.35 : 1;
                const centerY = height / 2;
                const pipeHeight = 60 * visualScale;
                const pipeY = centerY - pipeHeight / 2;

                const gradient = ctx.createLinearGradient(0, 0, width, 0);
                gradient.addColorStop(0, '#eff6ff');
                gradient.addColorStop(1, '#eff6ff');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, pipeY, width, pipeHeight);

                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 2 * visualScale;
                ctx.beginPath();
                ctx.moveTo(0, pipeY);
                ctx.lineTo(width, pipeY);
                ctx.moveTo(0, pipeY + pipeHeight);
                ctx.lineTo(width, pipeY + pipeHeight);
                ctx.stroke();

                const pumpX = width * 0.16;
                const resX = width * 0.42;
                const tapX = width * 0.72;

                ctx.save();
                ctx.beginPath();
                ctx.rect(0, pipeY, width, pipeHeight);
                ctx.clip();

                const flowSpeed = currentI * 15;
                particlesRef.current.forEach((p) => {
                    if (isSystemOn) {
                        p.x += flowSpeed * p.speedOffset;
                    } else {
                        p.x += Math.sin(Date.now() / 500) * 0.2;
                    }
                    if (p.x > width) p.x = -10;

                    let color = '#2563eb';
                    if (p.x > resX) {
                        const dropRatio = internalDrop / 0.5;
                        const opacity = 1.0 - dropRatio * 0.8;
                        color = `rgba(37, 99, 235, ${Math.max(0.2, opacity)})`;
                    }

                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.arc(p.x, centerY + p.y * visualScale, p.size * visualScale, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();

                ctx.save();
                ctx.translate(pumpX, centerY);
                ctx.beginPath();
                ctx.arc(0, 0, 45 * visualScale, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.lineWidth = 3 * visualScale;
                ctx.strokeStyle = '#e2e8f0';
                ctx.stroke();
                ctx.shadowColor = 'rgba(0,0,0,0.1)';
                ctx.shadowBlur = 10 * visualScale;
                impellerAngleRef.current += isSystemOn ? 0.15 : 0.02;
                ctx.rotate(impellerAngleRef.current);
                ctx.fillStyle = '#94a3b8';
                for (let i = 0; i < 6; i++) {
                    ctx.beginPath();
                    ctx.ellipse(0, -20 * visualScale, 8 * visualScale, 20 * visualScale, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.rotate(Math.PI / 3);
                }
                ctx.beginPath();
                ctx.arc(0, 0, 10 * visualScale, 0, Math.PI * 2);
                ctx.fillStyle = '#475569';
                ctx.fill();
                ctx.restore();

                ctx.fillStyle = '#475569';
                ctx.font = `bold ${Math.round(12 * visualScale)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText('泵 (E)', pumpX, centerY + 65 * visualScale);

                ctx.save();
                ctx.translate(resX, centerY);
                ctx.beginPath();
                ctx.arc(0, 0, 40 * visualScale, 0, Math.PI * 2);
                ctx.fillStyle = '#fff7ed';
                ctx.fill();
                ctx.lineWidth = 3 * visualScale;
                ctx.strokeStyle = '#fdba74';
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(0, 0, 35 * visualScale, 0, Math.PI * 2);
                ctx.clip();
                ctx.strokeStyle = '#9a3412';
                ctx.lineWidth = 2 * visualScale;
                const rustyStep = 8 * visualScale;
                for (let i = -40 * visualScale; i < 40 * visualScale; i += rustyStep) {
                    ctx.beginPath(); ctx.moveTo(i, -40 * visualScale); ctx.lineTo(i, 40 * visualScale); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(-40 * visualScale, i); ctx.lineTo(40 * visualScale, i); ctx.stroke();
                }
                ctx.fillStyle = 'rgba(124, 45, 18, 0.4)';
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    ctx.arc((Math.random() - 0.5) * 40 * visualScale, (Math.random() - 0.5) * 40 * visualScale, Math.random() * 8 * visualScale, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                ctx.fillStyle = '#7c2d12';
                ctx.font = `bold ${Math.round(12 * visualScale)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText('内阻 (r)', resX, centerY + 65 * visualScale);

                ctx.save();
                ctx.translate(tapX, centerY - 20 * visualScale);
                ctx.fillStyle = '#d97706';
                ctx.fillRect(-10 * visualScale, 0, 20 * visualScale, 30 * visualScale);
                ctx.beginPath();
                ctx.moveTo(-10 * visualScale, 0);
                ctx.quadraticCurveTo(-10 * visualScale, -20 * visualScale, 20 * visualScale, -25 * visualScale);
                ctx.lineTo(30 * visualScale, -20 * visualScale);
                ctx.lineTo(30 * visualScale, -10 * visualScale);
                ctx.lineTo(20 * visualScale, -15 * visualScale);
                ctx.quadraticCurveTo(10 * visualScale, -10 * visualScale, 10 * visualScale, 0);
                ctx.fill();
                ctx.fillStyle = '#b45309';
                ctx.save();
                ctx.translate(0, -25 * visualScale);
                ctx.beginPath();
                ctx.moveTo(-15 * visualScale, -5 * visualScale);
                ctx.lineTo(15 * visualScale, -5 * visualScale);
                ctx.lineTo(15 * visualScale, 5 * visualScale);
                ctx.lineTo(-15 * visualScale, 5 * visualScale);
                ctx.fill();
                ctx.fillRect(-5 * visualScale, 0, 10 * visualScale, 15 * visualScale);
                ctx.restore();
                ctx.restore();

                ctx.fillStyle = '#475569';
                ctx.font = `bold ${Math.round(12 * visualScale)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText('用户水管', tapX, centerY + 65 * visualScale);

                const drawGauge = (x, val, label) => {
                    const gy = centerY - 80 * visualScale;
                    ctx.strokeStyle = '#94a3b8';
                    ctx.setLineDash([4 * visualScale, 4 * visualScale]);
                    ctx.lineWidth = 1 * visualScale;
                    ctx.beginPath();
                    ctx.moveTo(x, gy + 20 * visualScale);
                    ctx.lineTo(x, centerY - 20 * visualScale);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.beginPath();
                    ctx.arc(x, gy, 22 * visualScale, 0, Math.PI * 2);
                    ctx.fillStyle = 'white';
                    ctx.fill();
                    ctx.strokeStyle = '#cbd5e1';
                    ctx.lineWidth = 2 * visualScale;
                    ctx.stroke();
                    const angle = Math.PI * (0.8 + val / 2.0);
                    const nx = x + Math.cos(angle) * 16 * visualScale;
                    const ny = gy + Math.sin(angle) * 16 * visualScale;
                    ctx.strokeStyle = '#2563eb';
                    ctx.lineWidth = 2 * visualScale;
                    ctx.beginPath();
                    ctx.moveTo(x, gy);
                    ctx.lineTo(nx, ny);
                    ctx.stroke();
                    ctx.fillStyle = '#334155';
                    ctx.font = `${Math.round(10 * visualScale)}px sans-serif`;
                    ctx.fillText(val.toFixed(2), x, gy - 28 * visualScale);
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = `${Math.round(10 * visualScale)}px sans-serif`;
                    ctx.fillText(label, x, gy + 35 * visualScale);
                };

                drawGauge(resX - 60 * visualScale, EMF, '内部压力');
                drawGauge(resX + 60 * visualScale, terminalVoltage, '输出压力');
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return undefined;
                const ctx = canvas.getContext('2d');

                const render = () => {
                    draw(ctx, canvas.width, canvas.height);
                    animationFrameRef.current = requestAnimationFrame(render);
                };
                render();
                return () => cancelAnimationFrame(animationFrameRef.current);
            });

            const onToggleSystem = () => {
                const next = !isSystemOn;
                setIsSystemOn(next);
                emitStatus(next ? '已打开通路' : '已关闭通路');
            };

            const onTapChange = (event) => {
                const next = clamp01(parseFloat(event.target.value));
                setTapOpening(next);
                if (next > 0 && !isSystemOn) {
                    setIsSystemOn(true);
                }
            };

            if (isEmbedMode) {
                return (
                    <div className="w-screen h-screen bg-slate-100">
                        <div className="w-full h-full bg-white">
                            <canvas
                                ref={canvasRef}
                                width={isPresentationMode ? 1600 : 1280}
                                height={isPresentationMode ? 900 : 720}
                                className="w-full h-full object-contain"
                            />
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col w-full h-screen bg-slate-50 font-sans text-slate-800">
                    <div className="flex items-center justify-between px-6 py-4 bg-white border-b border-slate-200 shrink-0">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white shadow-lg shadow-blue-200">
                                <IconZap className="w-6 h-6" />
                            </div>
                            <div>
                                <h1 className="text-xl font-bold text-slate-900 leading-tight">电路水流类比模型</h1>
                                <p className="text-sm text-slate-500">电动势 (E) vs 路端电压 (U)</p>
                            </div>
                        </div>
                        <div className="px-3 py-1 bg-blue-50 text-blue-600 text-xs font-bold rounded-full border border-blue-100 flex items-center gap-1">
                            <IconActivity size={12} className="inline" /> 互动演示
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row flex-1 p-6 gap-6 overflow-hidden">
                        <div className="flex-1 flex flex-col gap-4 min-w-[300px] h-full overflow-hidden">
                            <div className="relative bg-white rounded-2xl border border-slate-200 shadow-sm flex-1 flex flex-col overflow-hidden min-h-0">
                                <div className="absolute top-4 left-4 bg-white/90 backdrop-blur px-3 py-2 rounded-lg border border-slate-100 shadow-sm z-10">
                                    <div className="text-xs text-slate-500 mb-1 font-medium">颜色代表水压 (电势)</div>
                                    <div className="w-32 h-2 rounded-full bg-gradient-to-r from-blue-600 to-blue-100"></div>
                                    <div className="flex justify-between text-[10px] text-slate-400 mt-1">
                                        <span>高</span>
                                        <span>低</span>
                                    </div>
                                </div>

                                <div className="flex-1 w-full min-h-0 relative">
                                    <canvas
                                        ref={canvasRef}
                                        width={isPresentationMode ? 1600 : 1280}
                                        height={isPresentationMode ? 900 : 720}
                                        className="w-full h-full object-contain absolute inset-0"
                                    />
                                </div>

                                <div className="bg-slate-900 text-white p-6 shrink-0 z-20">
                                    <div className="flex items-center justify-center gap-2 md:gap-8 flex-wrap">
                                        <div className="text-center">
                                            <div className="text-xs text-slate-400 mb-1">总电动势</div>
                                            <div className="text-2xl md:text-3xl font-serif text-yellow-400 font-bold">
                                                𝓔 = {EMF.toFixed(2)} <span className="text-base font-sans text-slate-500">V</span>
                                            </div>
                                        </div>

                                        <div className="text-slate-600 text-2xl font-bold">-</div>

                                        <div className="text-center">
                                            <div className="text-xs text-slate-400 mb-1">内阻损耗</div>
                                            <div className="text-2xl md:text-3xl font-serif text-red-400 font-bold">
                                                <span className="italic">Ir</span> = {internalDrop.toFixed(2)} <span className="text-base font-sans text-slate-500">V</span>
                                            </div>
                                        </div>

                                        <div className="text-slate-600 text-2xl font-bold">=</div>

                                        <div className="bg-slate-800 rounded-xl px-6 py-2 border border-slate-700 text-center">
                                            <div className="text-xs text-green-400 mb-1 font-bold tracking-wider uppercase">路端电压</div>
                                            <div className="text-3xl md:text-4xl font-serif text-green-400 font-bold">
                                                <span className="italic">U</span> = {terminalVoltage.toFixed(2)} <span className="text-base font-sans text-green-800">V</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="w-full lg:w-80 flex flex-col gap-4 shrink-0 overflow-y-auto">
                            <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm shrink-0">
                                <div className="flex items-center justify-between mb-6">
                                    <h3 className="font-bold text-slate-800 flex items-center gap-2">
                                        <IconPointer size={18} className="text-blue-500" />
                                        水龙头开度
                                    </h3>
                                    <button
                                        onClick={onToggleSystem}
                                        className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${
                                            isSystemOn ? 'bg-blue-100 text-blue-700 hover:bg-blue-200' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'
                                        }`}
                                    >
                                        {isSystemOn ? '已打开' : '已关闭'}
                                    </button>
                                </div>

                                <div className="mb-2 flex justify-between text-xs text-slate-500 font-medium">
                                    <span>断路 (I=0)</span>
                                    <span>最大电流</span>
                                </div>

                                <input
                                    type="range"
                                    min="0"
                                    max="1"
                                    step="0.01"
                                    value={tapOpening}
                                    onChange={onTapChange}
                                    className="w-full h-3 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600 mb-6"
                                />

                                <p className="text-xs text-slate-400 text-center">提示：拖动滑块模拟改变负载电阻（水管粗细）</p>
                            </div>

                            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex-1 shrink-0">
                                <div className="bg-blue-50/50 px-5 py-3 border-b border-blue-100">
                                    <h3 className="font-bold text-blue-900 flex items-center gap-2">
                                        <IconInfo size={18} className="text-blue-500" />
                                        {isSystemOn ? '水龙头打开 (通路)' : '水龙头关闭 (断路)'}
                                    </h3>
                                </div>

                                <div className="p-5 text-sm text-slate-600 space-y-4">
                                    {isSystemOn ? (
                                        <React.Fragment>
                                            <p>水流冲过生锈滤网（内阻），产生阻力压降。</p>
                                            <p className="text-red-500 font-bold text-lg">{internalDrop.toFixed(2)}V 的压力被内阻消耗掉了。</p>

                                            <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 font-mono text-center text-slate-700">
                                                U = {EMF} - {internalDrop.toFixed(2)} = <span className="text-green-600 font-bold">{terminalVoltage.toFixed(2)} V</span>
                                            </div>

                                            <p className="italic text-slate-400 text-xs mt-2 border-l-2 border-slate-200 pl-3">“水流越快，被内部滤网（内阻）‘截留’的压力就越多。”</p>
                                        </React.Fragment>
                                    ) : (
                                        <React.Fragment>
                                            <p>水不流动，滤网两端没有压力差。</p>
                                            <p className="text-slate-500 font-medium">此时外部出口测得的水压，完全等于叶轮产生的压力。</p>

                                            <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 font-mono text-center text-slate-700">
                                                U = E = {EMF.toFixed(2)} V
                                            </div>
                                        </React.Fragment>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WaterPumpBattery />);
    </script>
</body>
</html>
